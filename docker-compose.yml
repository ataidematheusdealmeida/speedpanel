services:
  speedpanel:
    image: speedpanel:local
    pull_policy: never
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8095:8095'
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - speedpanel-data:/data
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
volumes:
  speedpanel-data:
